apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loantrack-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: loantrack.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
